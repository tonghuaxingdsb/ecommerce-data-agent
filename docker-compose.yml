services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ecommerce-agent-postgres
    environment:
      POSTGRES_DB: ecommerce_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d ecommerce_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

